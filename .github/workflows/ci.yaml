name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ecommerce-ci
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check generated protobuf files
        run: |
          generated="$(git ls-files -- '*.pb.go' '*.pb.gw.go' '*.pb.validate.go' '*.grpc.pb.go' ':(exclude)integration-tests/**')"
          if [ -n "$generated" ]; then
            printf 'Generated protobuf files are tracked:\n%s\n' "$generated"
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            */go.sum
      - name: Install generation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq protobuf-compiler
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate code
        run: task generate
      - name: Run unit tests
        run: go test ./cart/... ./loms/... ./notifications/... ./pkg/...
      - name: Run linter
        env:
          LINT_BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task lint
      - name: Run integration tests
        run: |
          docker compose -f docker-compose.ci.yml -f docker-compose.test.yml up \
            --build --abort-on-container-exit --exit-code-from integration-tests
      - name: Clean up integration tests
        if: always()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.test.yml down -v --remove-orphans
